general {
    hide_cursor = false
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(10, 12, 10, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    font_size = 88
    font_family = Geist
    color = rgba(245, 246, 244, 1.0)
    position = 0, 135
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = Geist
    color = rgba(197, 199, 194, 1.0)
    position = 0, 82
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER · $LAYOUT
    font_size = 15
    font_family = Geist
    color = rgba(197, 199, 194, 1.0)
    position = 0, -74
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 0
    inner_color = rgba(24, 28, 23, 1.0)
    font_color = rgba(245, 246, 244, 1.0)
    check_color = rgba(91, 217, 159, 1.0)
    fail_color = rgba(255, 120, 107, 1.0)
    font_family = Geist
    placeholder_text = Введіть пароль
    fail_text = $PAMFAIL
    rounding = 18
    position = 0, -22
    halign = center
    valign = center
}
