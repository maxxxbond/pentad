name: ✨ Feature Request
description: Propose a new widget, UI enhancement, or system integration.
title: "[Feature]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a feature request, please search existing issues to ensure it hasn't been proposed already.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear and concise description of what the problem is. Ex. "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Design
      description: Describe the solution you'd like. How should it look in the Pentad UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false
